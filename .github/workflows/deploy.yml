name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set base URL for PR preview
        if: github.event_name == 'pull_request'
        run: echo "BASE_URL=/hike-tracker/pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_ENV"

      - name: Set base URL for production
        if: github.event_name == 'push'
        run: echo "BASE_URL=/hike-tracker/" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: ${{ env.BASE_URL }}

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: pr-${{ github.event.pull_request.number }}
          clean: true

      - name: Deploy to production
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          clean: true
          clean-exclude: |
            pr-*

      - name: Comment PR preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${{ github.repository_owner }}.github.io/hike-tracker/pr-${{ github.event.pull_request.number }}/`;
            const body = `🚀 **Preview deployed!**\n\nYour changes are available at: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('🚀 **Preview deployed!**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
